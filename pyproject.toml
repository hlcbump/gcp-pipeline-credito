[project]
name = "gcp-pipeline-credito"
version = "0.1.0"
description = "Credit health pipeline: BCB API → GCS → BigQuery → dbt → Looker Studio"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-storage>=2.19.0",
    "google-cloud-bigquery>=3.31.0",
    "requests>=2.32.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "dbt-bigquery>=1.9.0",
]
